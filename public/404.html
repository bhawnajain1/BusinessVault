<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>BusinessVault</title>
    <script>
      // GitHub Pages SPA fallback: rewrites /BusinessVault/foo/bar → /BusinessVault/?p=/foo/bar
      // so index.html loads, then main.tsx replays the path via history.replaceState.
      // Segment count = number of path segments in the base ('/BusinessVault/' → 1).
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
